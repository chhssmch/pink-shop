{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Чат: {{ room_name }}</h2>
    
    <!-- Кнопки для быстрого переключения комнат -->
    <div style="margin-bottom: 15px;">
        <a href="/chat/general/" style="margin-right: 10px; text-decoration: none; padding: 5px 10px; background: #f0f0f0; border-radius: 5px;">💬 Общий</a>
        <a href="/chat/support/" style="margin-right: 10px; text-decoration: none; padding: 5px 10px; background: #f0f0f0; border-radius: 5px;">🆘 Поддержка</a>
        <a href="/chat/random/" style="text-decoration: none; padding: 5px 10px; background: #f0f0f0; border-radius: 5px;">🎲 Случайная</a>
    </div>
    
    <!-- Окно чата -->
    <div id="chat-log" style="height: 400px; border: 1px solid #ddd; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; background: #f9f9f9;">
        <div style="color: #999; text-align: center; padding: 20px;">
            Подключение к чату...
        </div>
    </div>
    
    <!-- Поле ввода -->
    <div style="display: flex; gap: 10px;">
        <input id="chat-message-input" type="text" placeholder="Введите сообщение..." 
               style="flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;">
        <button id="chat-message-submit" 
                style="background: #ff1493; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">
            Отправить
        </button>
    </div>
</div>

<script>
    const roomName = "{{ room_name }}";
    const chatSocket = new WebSocket(
        'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
    );
    
    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const chatLog = document.querySelector('#chat-log');
        
        // Убираем заглушку
        if (chatLog.children.length === 1 && chatLog.children[0].style?.color === 'rgb(153, 153, 153)') {
            chatLog.innerHTML = '';
        }
        
        const messageElement = document.createElement('div');
        messageElement.style.marginBottom = '12px';
        messageElement.style.padding = '8px';
        messageElement.style.borderRadius = '6px';
        
        if (data.type === 'system') {
            messageElement.style.backgroundColor = '#e3f2fd';
            messageElement.style.color = '#1976d2';
            messageElement.style.fontStyle = 'italic';
            messageElement.style.textAlign = 'center';
            messageElement.innerHTML = data.message;
        } else {
            messageElement.style.backgroundColor = data.username === "{{ user.username }}" ? '#ffebf0' : '#f0f0f0';
            messageElement.style.borderLeft = '3px solid #ff1493';
            messageElement.innerHTML = `<strong style="color: #ff1493;">${data.username}:</strong> ${data.message}`;
        }
        
        chatLog.appendChild(messageElement);
        chatLog.scrollTop = chatLog.scrollHeight;
    };
    
    chatSocket.onclose = function(e) {
        console.error('Соединение закрыто');
        const chatLog = document.querySelector('#chat-log');
        const errorElement = document.createElement('div');
        errorElement.style.backgroundColor = '#ffebee';
        errorElement.style.color = '#c62828';
        errorElement.style.padding = '10px';
        errorElement.style.borderRadius = '6px';
        errorElement.style.textAlign = 'center';
        errorElement.innerHTML = '⚠️ Соединение потеряно. Перезагрузите страницу.';
        chatLog.appendChild(errorElement);
    };
    
    document.querySelector('#chat-message-submit').onclick = function(e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value;
        
        if (message.trim()) {
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
        }
    };
    
    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.keyCode === 13) {
            document.querySelector('#chat-message-submit').click();
        }
    };
</script>
{% endblock %}
